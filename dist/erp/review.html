<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MORIYATI — Design Review</title><style>
@font-face{font-family:Workspace;src:url('../assets/Vazirmatn.woff2')}*{box-sizing:border-box}body{margin:0;background:#eee;color:#222;font:13px Workspace,sans-serif;height:100dvh;overflow:hidden}header{height:66px;background:#fff;display:flex;align-items:center;gap:15px;padding:0 25px;border-bottom:1px solid #ddd}header strong{font:700 16px Arial;letter-spacing:2px;margin-left:auto}button,a{font:inherit;border:0;border-radius:7px;background:none;cursor:pointer;padding:8px 13px;color:#666;text-decoration:none}button.active{background:#eee;color:#111}main{height:calc(100dvh - 66px);display:flex;justify-content:center;align-items:center;padding:18px;overflow:auto}iframe{border:1px solid #ddd;border-radius:18px;box-shadow:0 15px 50px #0000000c;background:white;flex-shrink:0;width:390px;height:min(844px,calc(100dvh - 100px));max-width:100%}body[data-device=tablet] iframe{width:820px;border-radius:12px}body[data-device=desktop] iframe{width:100%;border-radius:8px;height:100%}@media(max-width:600px){header{gap:4px;padding:0 10px}header strong{font-size:11px}button,a{padding:8px;font-size:11px}main{padding:8px}iframe{height:100%;border-radius:10px}}
</style></head><body data-device="phone"><header><strong>MORIYATI / REVIEW</strong><button class="active" data-device="phone">گوشی</button><button data-device="tablet">تبلت</button><button data-device="desktop">کامپیوتر</button><a href="./">بازکردن مستقیم</a></header><main><iframe title="پیش‌نمونه موریاتی" src="./index.html" allow="microphone"></iframe></main><script>document.querySelectorAll('button[data-device]').forEach(b=>b.onclick=()=>{document.body.dataset.device=b.dataset.device;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));});</script></body></html>
