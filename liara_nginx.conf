# Included inside Liara's existing server block (Static platform).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml image/svg+xml;

location / {
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
    add_header Cache-Control "no-cache";
}

location ~ /\.well-known {
    allow all;
}

# Only content-addressed bundles can be cached across future releases.
location ~* "\.[a-f0-9]{12}\.(?:js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

location ~* \.(?:html?|json|xml)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

location ~* \.(?:js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    access_log off;
}

location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    access_log off;
}
